<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>脱口而出 · English Reflex</title><link rel="stylesheet" href="style.css"><style> .practice-spaces{position:relative;margin:0;font:14px/1.5 system-ui,sans-serif;z-index:50}.practice-spaces>summary{list-style:none;cursor:pointer;border:1px solid currentColor;padding:8px 14px;white-space:nowrap;background:var(--paper,#faf6e9);color:var(--ink,#222)}.practice-spaces>summary::-webkit-details-marker{display:none}.practice-spaces>summary:after{content:' ＋'}.practice-spaces[open]>summary:after{content:' −'}.practice-spaces .space-links{position:absolute;right:0;top:calc(100% + 8px);width:min(280px,80vw);max-height:60vh;overflow:auto;background:var(--paper,#faf6e9);border:2px solid var(--ink,#222);box-shadow:4px 4px 0 #222;display:grid;padding:8px;gap:4px}.space-links a{padding:12px;color:var(--ink,#222);text-decoration:none;display:flex;justify-content:space-between}.space-links a:hover{background:#deded5}.space-links a[aria-current]{font-weight:750;border-left:3px solid currentColor}header{display:flex;align-items:center;justify-content:space-between;gap:12px}.practice-spaces:focus-within summary{outline-offset:3px}@media(max-width:600px){header>b{font-size:14px}.practice-spaces>summary{font-size:12px;padding:7px 10px}}</style></head><body>
<header><b>脱口而出 <span style="font-weight:400">/ English Reflex</span></b><details class="practice-spaces"><summary>练习空间</summary><div class="space-links"><a href="https://english-reflex-jy.julayaaa.chatgpt.site" aria-current="page">脱口而出<span aria-hidden="true">●</span></a><a href="https://verb-workshop-jy.julayaaa.chatgpt.site">动词练习室<span aria-hidden="true">↗</span></a></div></details></header>
<main><section id="home" aria-label="选择训练"><div class="deck">
<button id="home-instant" class="playing-card" aria-label="开始即时表达"><span class="corner">01<span>♣</span></span><span class="card-symbol">♣</span><strong>即时表达</strong><small id="total-instant"></small><span class="corner bottom">01<span>♣</span></span></button>
<button id="home-workplace" class="playing-card" aria-label="开始职场沟通"><span class="corner">02<span>♦</span></span><span class="card-symbol">♦</span><strong>职场沟通</strong><small id="total-workplace"></small><span class="corner bottom">02<span>♦</span></span></button>
<button id="home-precision" class="playing-card" aria-label="开始精准表达"><span class="corner">03<span>♠</span></span><span class="card-symbol">♠</span><strong>精准表达</strong><small id="total-precision"></small><span class="corner bottom">03<span>♠</span></span></button>
<button id="home-advanced" class="playing-card" aria-label="开始进阶表达"><span class="corner">04<span>♥</span></span><span class="card-symbol">♥</span><strong>进阶表达</strong><small id="total-advanced"></small><span class="corner bottom">04<span>♥</span></span></button>
</div><button id="browse" class="browse-button">浏览与搜索全部语料 ↗</button><p id="loading" role="status">正在载入…</p></section>
<section id="workspace" hidden><div class="workspace-bar"><button id="backHome">首页</button><button id="browseFromPractice">浏览与搜索</button><button class="random-icon" data-practice-action="random" aria-label="随机一则" title="随机一则"><svg width="19" height="19" viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="M3 6h3c4 0 8 12 12 12h3m-4-4 4 4-4 4M3 18h3c1.5 0 3-1.7 4.5-4M14 8c1.5-1.3 2.5-2 4-2h3m-4-4 4 4-4 4" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg></button><span class="practice-position" role="status" aria-live="polite"></span></div>
<div id="browseControls" hidden><p id="coverage" class="counter"></p><div class="filters taxonomy-filters">

<label>训练类型<select id="typeFilter"><option value="">全部类型</option><option value="instant">即时表达</option><option value="workplace">职场沟通</option><option value="precision">精准表达</option><option value="advanced">进阶表达</option></select></label>
<label>细分类别<select id="topicFilter"><option value="">全部细分类别</option></select></label>


<label>标记状态<select id="progress"><option value="">全部</option><option value="marked">已标记</option></select></label></div><div id="activeFilters" class="active-filters"></div></div>
<div class="layout" id="trainingLayout"><aside><div class="counter" id="count"></div><nav id="nav" aria-label="选择词条"></nav><div class="actions"><button id="prevPage" aria-label="上一页">←</button><span id="pageInfo"></span><button id="nextPage" aria-label="下一页">→</button></div></aside>
<div class="practice-column">
<div class="card-frame"><button class="card-edge-button edge-previous" data-practice-action="previous" aria-label="上一则" title="上一则">‹</button><section class="card"><p id="empty" hidden>没有匹配的词条，试试调整类型或标签。</p><div id="exercise"><div class="entry-meta"><span class="pill" id="category"></span></div><div id="entryTags" class="entry-tags"></div><div id="relatedEntries" class="related-entries"></div>
<figure id="picturePrompt" class="picture-prompt" hidden><img id="pictureImage" alt="看图回想这个物品的英文名称"><figcaption>这个用英文怎么说？</figcaption></figure><div id="sceneLabel" class="scene-label">场景</div><p id="context"></p><section id="precisionPrompt" hidden><div class="scene-label">表达</div><p id="precisionChinese" class="precision-chinese"></p><p id="precisionCloze" class="cloze-en"></p><p id="precisionHint" class="cloze-hint"></p></section><section id="advancedPrompt" hidden><div class="scene-label">表达</div><p id="advancedChinese" class="precision-chinese"></p><p id="advancedBase" class="base-english"></p></section><h3 id="questionLabel">提问</h3><h2 id="cn"></h2><details class="layer" id="planning"><summary>沟通思路</summary><div class="layer-content"><p id="reason"></p></div></details>
<div class="actions" id="revealActions"><button id="reveal" class="primary" aria-expanded="false">看英文表达</button></div><details class="layer" id="chinesePanel" hidden><summary>中文表达</summary><div class="layer-content"><p id="suggestion" class="chinese-answer"></p></div></details><div class="actions" id="workEnglishActions" hidden><button id="revealEnglish" class="primary" aria-expanded="false" aria-controls="answer">看英文表达</button></div>
<div id="answer" hidden><div class="answer-heading"><h3 id="answerTitle">英文表达</h3></div>
<div class="version-tabs" role="group" aria-label="英文版本"><button id="casualTab">自然 / 口语版</button><button id="professionalTab">礼貌 / 专业版</button></div><div id="professionalPanel"><small id="proLabel">礼貌 / 专业版</small><p class="english" id="pro"></p></div><div id="casualPanel"><small id="casualLabel">自然 / 口语版</small><p class="english" id="casual"></p></div>
<section class="sentence-notes"><div class="study-tabs" role="group" aria-label="语境环节"><button id="explainNoteTab">为什么这样说</button><button id="variantNoteTab">语境变化</button><button id="fixNoteTab">直译改进</button></div><p id="explain"></p><p id="variant" hidden></p><p id="fix" hidden></p></section></div>
<div class="utility-buttons" aria-label="表达操作"><button id="shareExpression">分享到微信</button><button id="copy">复制这个表达</button><button id="master" aria-pressed="false">标记这个表达</button></div><div id="status" role="status" aria-live="polite"></div></div></section><button class="card-edge-button edge-next" data-practice-action="next" aria-label="下一则" title="下一则">›</button></div>
</div></div></section></main>
<dialog id="learningDialog" aria-labelledby="learningTitle"><button id="closeLearning" class="close-learning" aria-label="关闭表达学习">×</button><section id="learning" class="learning-section"><h3 id="learningTitle">表达中的学习</h3><p id="learnTerm" class="term-title"></p><p id="learnPronunciation" class="pronunciation" hidden></p><div class="study-tabs" role="group" aria-label="词语学习"><button id="meaningTab">释义</button><button id="exampleTab">例句</button><button id="formsTab">变化与搭配</button><button id="alternativesTab">替代表达</button></div><div id="meaningStudy"><p id="learnMeaning"></p></div><div id="exampleStudy" hidden><p id="learnExample" class="example-en"></p><p id="learnExampleCn" class="hint"></p></div><div id="formsStudy" hidden><p id="learnForms"></p></div><div id="alternativesStudy" hidden><p id="learnAlternatives"></p></div></section></dialog>
<dialog id="exportDialog" aria-labelledby="exportTitle"><button id="closeExport" class="close-learning" aria-label="关闭分享与复制">×</button><h3 id="exportTitle">复制这个表达</h3><p id="exportHelp" class="hint"></p><pre id="exportContent" tabindex="0" aria-label="待复制内容"></pre><div class="export-actions"><button id="exportCopy" class="primary">复制 Markdown</button><button id="exportDone">关闭</button></div><p id="exportStatus" role="status" aria-live="polite"></p></dialog>
<script src="app.js"></script></body></html>
