e{background:#2050b4}.prompt{font-weight:700}.english{font-family:Arial,system-ui,sans-serif}mark{background:#f2c72c;color:#141414;border-radius:0}.foot{justify-content:flex-start}.foot button{font-weight:650}footer{text-align:left;border-top:2px solid #141414;padding-top:18px;margin-top:32px}.practice-spaces>summary{border:2px solid #141414;font-weight:700}button:focus-visible,.card:focus-visible{outline-color:#2050b4}@media(max-width:600px){body{border:0;outline:0;border-radius:0;padding-top:0}header{margin:0;padding:14px 16px;flex-wrap:wrap}.logo{font-size:17px}header>.small{display:none}main{padding:0 18px;margin-top:28px}h1{font-size:40px;padding-right:60px;letter-spacing:-2px}h1:after{width:50px;height:50px;right:0;top:5px;box-shadow:-16px 30px 0 -5px #f2c72c}.mode{padding:13px 8px}.mode b{font-size:14px}.card{padding:24px 20px}.tools input{width:100%}.foot button{font-size:12px}nav{gap:6px}nav button{font-size:13px}.stack-stage{margin-left:2px;margin-right:8px}}
</style><header><div class="logo">↗ 动词练习室</div><span class="small" id="count"></span><details class="practice-spaces"><summary>练习空间</summary><div class="space-links"><a href="https://english-reflex-jy.julayaaa.chatgpt.site">脱口而出<span aria-hidden="true">↗</span></a><a href="https://verb-workshop-jy.julayaaa.chatgpt.site" aria-current="page">动词练习室<span aria-hidden="true">●</span></a></div></details></header><main><p class="small">VERBS IN CONTEXT</p><h1>换一个动词，<br>把意思<span class="accent">说到位。</span></h1><div class="modes"><button class="mode active" data-mode="recall"><b>01 语境回想</b><span>从中文意思，找到动词</span></button><button class="mode" data-mode="cloze"><b>02 例句补全</b><span>在句子里练准确用词</span></button><button class="mode" data-mode="pair"><b>03 搭配复习</b><span>把一个词用到更多地方</span></button></div><div class="tools"><input id="search" placeholder="查找动词或中文意思" aria-label="查找动词或中文意思"><select id="filter" aria-label="筛选"><option value="all">全部语料</option><option value="saved">已标记</option><option value="review">待复习</option></select><button id="browse">词库</button></div><div class="list hidden" id="list"></div><nav><button id="prev">← 上一则</button><span class="small" id="position"></span><button id="random" aria-label="随机一则">⇄</button><button id="next">下一则 →</button></nav><div class="stack-stage" id="stage"><div class="stack-back back-three" aria-hidden="true"></div><div class="stack-back back-two" aria-hidden="true"></div><div class="stack-back back-one" aria-hidden="true"></div><article class="card" id="card" tabindex="0" aria-label="练习卡片，左右方向键切换"></article></div><div class="foot"><button id="save"></button><button id="review">加入待复习</button><button id="copy">复制表达</button></div><footer>先想一想，再展开答案。标记与复习进度保存在当前浏览器。</footer></main><script>
let all=[],pool=[],idx=0,mode='recall',saved=JSON.parse(localStorage.getItem('verbs-saved')||'[]'),review=JSON.parse(localStorage.getItem('verbs-review')||'[]');
const $=s=>document.querySelector(s),esc=s=>String(s||'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function blank(r){let root=r.word.replace(/e$/,'');let re=new RegExp('\\b'+root+'[a-z]*\\b','ig');return esc(r.en.replace(re,'____'))}
function speak(t){if(!window.speechSynthesis)return; speechSynthesis.cancel();let u=new SpeechSynthesisUtterance(t);u.lang='en-US';speechSynthesis.speak(u)}
function render(){let r=pool[idx];$('#position').textContent=pool.length?(idx+1)+' / '+pool.length:'0 / 0';if(!r){$('#card').innerHTML='<p>没有符合条件的语料。试试全部语料。</p>';return}let prompt=mode==='pair'?r['中文释义']:r.cn;$('#card').innerHTML='<p class="label">'+(mode==='recall'?'中文表达 · 回想合适的动词':mode==='cloze'?'补全例句中的动词':'搭配复习 · 这个意思，你会用哪个动词？')+'</p>'+(r['情景']?'<p>'+esc(r['情景'])+'</p>':'')+'<p class="prompt">'+esc(prompt)+'</p>'+(mode==='cloze'?'<p class="english">'+blank(r)+'</p>':'')+'<button class="primary" id="reveal">看参考表达 ↗</button><section id="answer" class="answer hidden"><p class="english"><mark>'+esc(r.word)+'</mark> <button id="sound" aria-label="朗读英文">▷</button></p><p>'+esc(r['中文释义'])+'</p><p class="english">'+esc(r.en)+'</p>'+(r['搭配词']?'<p>常见搭配：'+esc(JSON.parse(r['搭配词']).join(' · '))+'</p>':'')+'<details><summary>展开学习笔记与更多用法</summary>'+['中文解释','更多扩展1','更多扩展翻译1','更多扩展2','更多扩展翻译2','关联词','低情商说法','高情商处理方式'].filter(k=>r[k]).map(k=>'<p><span class="small">'+esc(k==='低情商说法'?'原始说法':k==='高情商处理方式'?'沟通建议':k)+'</span><br>'+esc(r[k])+'</p>').join('')+'</details></section>';
$('#reveal').onclick=()=>{$('#answer').classList.remove('hidden');$('#reveal').classList.add('hidden')};$('#sound').onclick=()=>speak(r.en||r.word);$('#save').textContent=saved.includes(r.id)?'已标记 ✓':'标记表达';$('#review').textContent=review.includes(r.id)?'移出待复习':'加入待复习';$('#list').innerHTML=pool.map((x,i)=>'<button data-i="'+i+'">'+esc(x.word)+'<small>'+esc(x['中文释义'])+'</small></button>').join('');$('#list').querySelectorAll('button').forEach(b=>b.onclick=()=>{idx=+b.dataset.i;render()})}
function filter(){let q=$('#search').value.toLowerCase(),f=$('#filter').value;pool=all.filter(r=>JSON.stringify(r).toLowerCase().includes(q)&&(f==='all'||(f==='saved'?saved:review).includes(r.id)));idx=0;render()}
document.querySelectorAll('[data-mode]').forEach(b=>b.onclick=()=>{mode=b.dataset.mode;document.querySelectorAll('[data-mode]').forEach(x=>x.classList.toggle('active',x===b));render()});let busy=false;
function deal(step,random=false){if(busy||pool.length<2)return;busy=true;let card=$('#card'),reduce=matchMedia('(prefers-reduced-motion: reduce)').matches;let target=random?(idx+1+Math.floor(Math.random()*(pool.length-1)))%pool.length:(idx+step+pool.length)%pool.length;let dir=step<0?-1:1;const finish=()=>{idx=target;render();if(reduce){busy=false;return}card.animate([{transform:'translate3d(0,-10px,-18px) rotate(-1.3deg) scale(.97)',opacity:.65},{transform:'translate3d(0,0,0) rotate(0deg) scale(1)',opacity:1}],{duration:420,easing:'cubic-bezier(.16,1,.3,1)'}).finished.then(()=>busy=false)};if(reduce){finish();return}card.animate([{transform:'translate3d(0,0,0) rotate(0deg)',opacity:1},{transform:'translate3d('+dir*110+'%,-12px,4px) rotate('+dir*14+'deg)',opacity:0}],{duration:300,easing:'cubic-bezier(.4,0,.8,.3)'}).finished.then(finish)}
$('#prev').onclick=()=>deal(-1);$('#next').onclick=()=>deal(1);$('#random').onclick=()=>deal(1,true);
let start=null,dx=0;$('#card').addEventListener('pointerdown',e=>{if(e.target.closest('button,summary,details')||busy)return;start={x:e.clientX,y:e.clientY};dx=0});window.addEventListener('pointermove',e=>{if(!start)return;dx=e.clientX-start.x;let dy=e.clientY-start.y;if(Math.abs(dy)>Math.abs(dx)+15){start=null;$('#card').style.transform='';return}if(Math.abs(dx)>10)$('#card').style.transform='translateX('+Math.max(-150,Math.min(150,dx))+'px) rotate('+dx/25+'deg)'});function release(){if(!start)return;start=null;$('#card').style.transform='';if(Math.abs(dx)>65)deal(dx<0?1:-1)}window.addEventListener('pointerup',release);window.addEventListener('pointercancel',()=>{start=null;$('#card').style.transform=''});$('#card').addEventListener('keydown',e=>{if(e.target!==$('#card'))return;if(e.key==='ArrowLeft'||e.key==='ArrowRight'){e.preventDefault();deal(e.key==='ArrowLeft'?-1:1)}});
$('#search').oninput=filter;$('#filter').onchange=filter;$('#browse').onclick=()=>$('#list').classList.toggle('hidden');
function toggle(a,key){let r=pool[idx];if(!r)return;let i=a.indexOf(r.id);i<0?a.push(r.id):a.splice(i,1);localStorage.setItem(key,JSON.stringify(a));render()}
$('#save').onclick=()=>toggle(saved,'verbs-saved');$('#review').onclick=()=>toggle(review,'verbs-review');$('#copy').onclick=async()=>{let r=pool[idx];if(!r)return;try{await navigator.clipboard.writeText('## '+r.word+'\n'+r.cn+'\n\n'+r.en+'\n\n'+r['中文释义']);$('#copy').textContent='已复制 ✓'}catch{window.prompt('复制表达',r.en)}};
fetch('data.json').then(r=>r.json()).then(d=>{all=d;pool=d;$('#count').textContent=d.length+' 个动词 · 三种练法';render()}).catch(()=>$('#card').textContent='语料加载失败，请刷新重试');
</script></html>
